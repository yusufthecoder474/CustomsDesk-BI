name: CustomsDesk verified pipeline
on: [push, pull_request, workflow_dispatch]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-dev.txt -e .
      - run: python -m pytest -q -k 'not postgresql' --junitxml=reports/ci-unit-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-evidence
          path: reports/ci-unit-tests.xml
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: customsdesk
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: ci_ephemeral_only
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-dev.txt -e .
      - run: python -m customsdesk.verification
        env:
          CUSTOMSDESK_CI_ADMIN_URL: postgresql+psycopg://customsdesk:ci_ephemeral_only@127.0.0.1:5432/postgres
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-evidence
          path: reports/ci-postgres-tests.xml
